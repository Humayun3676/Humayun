<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404: Page Not Found | Humayun Mirza</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#EFEFEF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --bg: #EFEFEF;
        --text: #0f172a;
        --muted: #64748b;
        --card: rgba(255, 255, 255, 0.9);
        --border: #e2e8f0;
      }
      html.dark {
        --bg: #0B1120;
        --text: #f8fafc;
        --muted: #94a3b8;
        --card: rgba(15, 23, 42, 0.9);
        --border: #334155;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .code {
        font-size: clamp(6rem, 15vw, 10rem);
        font-weight: 900;
        letter-spacing: -0.05em;
        line-height: 1;
        margin-bottom: 1rem;
        background: linear-gradient(135deg, #1e293b, #2563eb);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      html.dark .code {
        background: linear-gradient(135deg, #ffffff, #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h1 {
        font-size: clamp(1.5rem, 4vw, 2.25rem);
        font-weight: 800;
        margin-bottom: 0.75rem;
      }
      p {
        color: var(--muted);
        max-width: 440px;
        line-height: 1.6;
        margin-bottom: 2rem;
        font-size: 1rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.85rem 1.75rem;
        background-color: #2563eb;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.95rem;
        border-radius: 0.75rem;
        box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
        transition: transform 0.2s, background-color 0.2s;
      }
      .btn:hover {
        background-color: #1d4ed8;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
    <a href="/" class="btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Return to Homepage
    </a>
  </body>
</html>
