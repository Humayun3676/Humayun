    <!-- Theme Initialization Script (Prevents flash of unstyled theme on cold start) -->

          var dark = t !== null ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;

          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
